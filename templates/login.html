<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login - Shifa Medical Centre</title><link rel="stylesheet" href="/static/css/style.css"><link rel="stylesheet" href="/static/css/extra.css"></head>
<body><form method="post" class="card login">
<h1>Shifa Medical Centre</h1><p class="muted">Sign in</p>
{% with m = get_flashed_messages() %}{% for t in m %}<div class="toast err">{{ t }}</div>{% endfor %}{% endwith %}
<label>Username<input name="username" required autofocus></label>
<label>Password<input name="password" type="password" required></label>
<button class="btn btn-primary btn-lg">Login</button></form></body></html>
